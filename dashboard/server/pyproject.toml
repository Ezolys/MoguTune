[project]
name = "mogutune-dashboard"
version = "0.1.0"
description = "MoguTune Dashboard"
requires-python = ">=3.13"
dependencies = [
	"fastapi>=0.115.0",
	"httpx>=0.28.1",
	"pymongo>=4.17.0",
	"PyJWT[crypto]>=2.10.0",
	"tzdata>=2024.1",
	"uvicorn[standard]>=0.32.0",
]

[dependency-groups]
dev = [
	"pytest>=8.3.0",
	"pytest-asyncio>=0.25.0",
	"ruff>=0.16.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mogutune_dashboard"]

[tool.uv]
exclude-newer = "1 week"

[tool.ruff]
line-length = 140

[tool.ruff.format]
docstring-code-format = true
indent-style = "tab"

[tool.ruff.lint]
select = ["ALL"]
# 無視するルール (Bot 本体と同じ方針)
ignore = [
	"BLE001", # キャッチする例外が明示されていない
	"COM812", # 末尾にカンマがない
	"FIX002", # TODO がある
	"ERA001", # コメントアウトされたコード
	"D1",    # docstring が存在しない
	"D203",  # docstring の前に空白行がない
	"D206", # docstring にタブによるインデントが使用されている
	"D213",  # docstring の最初の行が空白行ではない
	"D400", # docstring の最初の行の末尾が句読点で終わっていない
	"D415", # 同上 (クエスチョンマークなども含む)
	"INP001", # __init__.py ファイルが欠けているパッケージあり
	"RUF001", # あいまいな Unicode 文字の文字列
	"RUF003", # あいまいな Unicode 文字のコメント
	"SIM105", # try-except-pass ブロックを contextlib.suppress コンテキストマネージャーに置き換え
	"TD001", # invalid todo tag
	"TD002", # missing todo author
	"TD003", # missing todo link
	"W191", # インデントがタブになっている
]
unfixable = [
	"F401", # unused import
	"F841", # unused variable
]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["S101", "S311", "SLF001", "PT011", "PLR2004"] # テストの assert / 決定論的乱数 / プライベートアクセス / 例外メッセージ省略 / マジック値は許容
# FastAPI は実行時に型ヒントを評価するため、依存関係の型は実行時 import が必要
"src/mogutune_dashboard/db.py" = ["TC002"]
"src/mogutune_dashboard/routers/*.py" = ["TC001"]

[tool.ruff.lint.mccabe]
max-complexity = 30

[tool.ruff.lint.pylint]
max-args = 6
max-branches = 30

[tool.pytest.ini_options]
asyncio_mode = "auto"
