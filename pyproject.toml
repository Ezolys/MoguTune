[project]
name = "mogutune"
version = "0.1.0"
description = "MoguTune"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "mafic>=2.11.0",
    "mogutune-core @ git+https://github.com/Ezolys/MoguTune-Core.git@v0.2.0",
    "py-cord[speed,voice]>=2.8.1",
    "pycord-localizer>=0.1.3",
    "pymongo>=4.17.0",
    "uuid-utils>=0.17.0",
    "websockets>=14.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "python-dotenv>=1.2.2",
    "ruff>=0.16.3",
]

[tool.uv]
exclude-newer = "1 week"

[tool.ruff]
line-length = 140

[tool.ruff.format]
docstring-code-format = true
indent-style = "tab"

[tool.ruff.lint]
select = ["ALL"]
# 無視するルール
ignore = [
    "BLE001", # キャッチする例外が明示されていない
    "COM812", # 末尾にカンマがない
    "FIX002", # TODO がある
    "ERA001", # コメントアウトされたコード
    "D1",    # docstring が存在しない
    "D203",  # docstring の前に空白行がない
    "D206", # docstring にタブによるインデントが使用されている
    "D213",  # docstring の最初の行が空白行ではない
    "D400", # docstring の最初の行の末尾が句読点で終わっていない
    "D415", # 同上 (クエスチョンマークなども含む)
    "INP001", # __init__.py ファイルが欠けているパッケージあり
    "RUF001", # あいまいな Unicode 文字の文字列
    "RUF003", # あいまいな Unicode 文字のコメント
    "SIM105", # try-except-pass ブロックを contextlib.suppress コンテキストマネージャーに置き換え
    "TD001", # invalid todo tag
    "TD002", # missing todo author
    "TD003", # missing todo link
    "W191", # インデントがタブになっている
]
unfixable = [
    "F401", # unused import
    "F841", # unused variable
]

[tool.ruff.lint.mccabe]
max-complexity = 30

[tool.ruff.lint.pylint]
max-args = 6
max-branches = 30

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["S101", "S311", "PLR2004"] # テストの assert / 決定論的乱数 / マジック値は正当

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
